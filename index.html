<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" role="application" aria-label="Scientific calculator">
    <header class="top-row">
      <div class="mode">
        <label>
          <input type="checkbox" id="degToggle" />
          Degrees
        </label>
      </div>
      <div class="history-controls">
        <button id="clearHistory" title="Clear history">Clear history</button>
      </div>
    </header>

    <div class="display" aria-live="polite">
      <div class="expr" id="expr" aria-hidden="true"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="container">
      <section class="keys" role="group" aria-label="Calculator keys">
        <button class="key clear" data-action="clear">C</button>
        <button class="key clear" data-action="back">⌫</button>
        <button class="key" data-value="(">(</button>
        <button class="key" data-value=")">)</button>

        <button class="key fn" data-value="sin(">sin</button>
        <button class="key fn" data-value="cos(">cos</button>
        <button class="key fn" data-value="sqrt(">√</button>
        <button class="key" data-value="%">%</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key op" data-value="/">÷</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key op" data-value="*">×</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key op" data-value="-">−</button>

        <button class="key wide" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key op" data-action="equals">=</button>
        <button class="key op" data-value="+">+</button>

        <button class="key fn" data-value="pow(" title="pow(x,y)">x^y</button>
        <button class="key fn" data-value="ln(">ln</button>
        <button class="key fn" data-value="log10(">log</button>
        <button class="key fn" data-value="abs(">abs</button>
      </section>

      <aside class="history" aria-label="Operation history">
        <h3>History</h3>
        <ul id="historyList"></ul>
      </aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
